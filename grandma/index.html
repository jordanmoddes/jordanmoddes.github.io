<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Gma's Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Gma's Page — a daily little visit from Jordan
   Palette: lavender linen, plum, marigold, leaf, rose
   Type: Atkinson Hyperlegible (made for low vision) for the app,
         Patrick Hand for anything Jordan "writes"
   ========================================================= */
:root{
  --bg:#F5F1F7; --paper:#FFFFFF; --paper2:#EFE8F2; --line:#DDD2E2;
  --ink:#2A2130; --ink2:#5C4F63;
  --plum:#5E2F66; --plum-press:#43204A; --plum-tint:#EBDDEE; --on-plum:#FFFFFF;
  --leaf:#2F7048; --leaf-tint:#DDEFE2;
  --marigold:#E39B12; --marigold-tint:#FDF0D2;
  --rose:#C9506B; --rose-tint:#FBE3E8;
  --sky:#3F74A6; --sky-tint:#DFEAF5;
  --letter:#FFFCF3; --letter-ink:#3A2E40; --letter-line:rgba(63,116,166,.16);
  --shadow:0 1px 0 rgba(94,47,102,.06), 0 6px 20px rgba(94,47,102,.08);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --hand:'Patrick Hand','Segoe Print','Bradley Hand','Comic Sans MS',cursive;
  --sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
body.night{
  --bg:#1E1722; --paper:#2A2130; --paper2:#352A3C; --line:#4A3D52;
  --ink:#F3ECF5; --ink2:#CBBFD1;
  --plum:#D3B0DB; --plum-press:#A27FAA; --plum-tint:#3D2E45; --on-plum:#1E1722;
  --leaf:#8ED1A5; --leaf-tint:#22392B;
  --marigold:#F2C14E; --marigold-tint:#3A3020;
  --rose:#F0A0B2; --rose-tint:#3E2530;
  --sky:#9CC3E8; --sky-tint:#22303F;
  --letter:#EDE3D3; --letter-ink:#2E2433; --letter-line:rgba(63,116,166,.14);
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:20px;-webkit-text-size-adjust:100%}
html.xl{font-size:23px}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;
  -webkit-tap-highlight-color:transparent;transition:background-color .4s,color .4s}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px calc(48px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.hand{font-family:var(--hand)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3.3rem;
  padding:.75rem 1.1rem;border-radius:var(--r-md);font-weight:700;font-size:1.05rem;text-align:center;
  line-height:1.25;transition:transform .12s,box-shadow .12s,background-color .2s}
.btn + .btn{margin-top:.65rem}
.btn-main{background:var(--plum);color:var(--on-plum);box-shadow:0 4px 0 var(--plum-press)}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum-press)}
.btn-soft{background:var(--paper2);color:var(--ink)}
.btn-soft:active,.btn-line:active,.btn-rose:active{transform:scale(.97)}
.btn-line{border:2px solid var(--line);color:var(--ink)}
.btn-rose{background:var(--rose-tint);color:var(--ink);border:2px solid var(--rose)}
.btn:disabled{opacity:.45}
.btn.small{width:auto;min-height:2.7rem;padding:.45rem 1rem;font-size:.98rem}
.btn.nudge{animation:nudge 1.2s ease-in-out 3}

/* ---------- home ---------- */
.hello{padding:1.3rem 0 1.1rem}
.hello-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem .6rem;margin-bottom:.35rem}
.date{color:var(--ink2);font-size:.86rem;white-space:nowrap}
.gear{display:flex;align-items:center;gap:.3rem;min-height:2.8rem;padding:.35rem .75rem;flex-shrink:0;border-radius:999px;
  background:var(--paper);border:2px solid var(--line);font-weight:700;font-size:.86rem;color:var(--ink2)}
.hello h1{font-size:2.05rem;line-height:1.08;letter-spacing:-.015em;margin-bottom:.45rem}
.from{font-family:var(--hand);font-size:1.4rem;line-height:1.3;color:var(--plum)}
.from .sig{white-space:nowrap}

.panel{background:var(--paper);border-radius:var(--r-lg);padding:1.15rem 1.1rem 1.2rem;box-shadow:var(--shadow);margin-bottom:1rem}
.panel h2,.list-h{font-size:1.25rem;line-height:1.2}
.panel .sub{color:var(--ink2);font-size:.98rem;margin:.2rem 0 .85rem}

.welcome{background:var(--plum-tint);box-shadow:none}
.welcome .hand-big{font-family:var(--hand);font-size:1.55rem;line-height:1.25;color:var(--plum);margin-bottom:.3rem}
.welcome p{margin-bottom:.8rem}

.note-card{display:flex;align-items:center;gap:.95rem;width:100%;padding:1rem 1.1rem;margin-bottom:1rem;
  border-radius:var(--r-lg);background:var(--rose-tint);border:2px solid transparent;text-align:left}
.note-card .env{font-size:2.4rem;line-height:1;flex-shrink:0}
.note-card.unread .env{animation:wiggle 2.6s ease-in-out infinite}
.note-card.locked{background:var(--paper);border:2px dashed var(--rose)}
.note-card b{display:block;font-size:1.08rem;line-height:1.25}
.note-card .nc-sub{display:block;color:var(--ink2);font-size:.95rem;line-height:1.3;margin-top:.15rem}
.note-card .nc-quote{display:block;font-family:var(--hand);font-size:1.2rem;color:var(--plum);line-height:1.25;margin-top:.15rem}

.steps{list-style:none;display:grid;gap:.55rem;margin-bottom:1rem}
.step{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.6rem;padding:.5rem .75rem;
  border-radius:var(--r-md);background:var(--paper2);border:2px solid transparent;text-align:left}
.step .num{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  font-weight:700;background:var(--paper);border:2px solid var(--line)}
.step .s-ico{font-size:1.4rem;line-height:1}
.step .s-name{font-weight:700;font-size:1.05rem}
.step.next{border-color:var(--plum)}
.step.done{background:var(--leaf-tint)}
.step.done .num{background:var(--leaf);border-color:var(--leaf);color:var(--paper)}

.garden .g-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.run{font-weight:700;font-size:.92rem;color:var(--plum)}
.bed{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.05rem .1rem;min-height:2.6rem;padding:.6rem .5rem 0;
  font-size:1.75rem;line-height:1.05}
.bed .new{animation:bloom .9s cubic-bezier(.2,.9,.3,1.3) both}
.planter{height:1.05rem;border-radius:5px 5px 14px 14px;background:linear-gradient(#A0704A,#7D5233);margin:0 0 .8rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem;text-align:center;margin-top:.4rem}
.week .wd{font-size:.8rem;color:var(--ink2);line-height:1.2}
.week .wf{height:2.1rem;display:grid;place-items:center;font-size:1.3rem}
.week .wf .empty{width:.7rem;height:.7rem;border-radius:50%;border:2px solid var(--line)}
.week .today .wd{color:var(--plum);font-weight:700}
.week .today .wf{background:var(--plum-tint);border-radius:var(--r-sm)}

.list-h{margin:1.4rem 0 .7rem}
.games{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1.2rem}
.game-row{display:flex;align-items:center;gap:.85rem;width:100%;min-height:4.4rem;padding:.8rem 1rem;
  border-bottom:1.5px solid var(--line);text-align:left;transition:background-color .15s}
.game-row:last-child{border-bottom:0}
.game-row:active{background:var(--paper2)}
.g-ico{width:2.8rem;height:2.8rem;border-radius:14px;display:grid;place-items:center;font-size:1.45rem;flex-shrink:0}
.g-txt{flex:1;min-width:0}
.g-name{display:block;font-weight:700;font-size:1.07rem;line-height:1.25}
.g-desc{display:block;color:var(--ink2);font-size:.92rem;line-height:1.3}
.g-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .5rem;margin-top:.25rem}
.g-grow{color:var(--leaf);font-size:.85rem;font-weight:700}
.g-end{flex-shrink:0;font-weight:700;color:var(--ink2);font-size:1.5rem;line-height:1}
.tick{display:inline-block;font-size:.82rem;color:var(--leaf);background:var(--leaf-tint);border-radius:999px;padding:.2rem .6rem}
.foot{display:grid;gap:.65rem}
.foot .btn + .btn{margin-top:0}

/* ---------- how are you feeling ---------- */
.feel h2{margin-bottom:.7rem}
.feel-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.feel-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;min-height:5.4rem;
  padding:.6rem .3rem;border-radius:var(--r-md);background:var(--paper2);border:2.5px solid transparent;
  font-weight:700;font-size:.95rem;line-height:1.15;text-align:center;transition:background-color .2s,border-color .2s}
.feel-btn .fe{font-size:1.8rem;line-height:1}
.feel-btn.on{background:var(--plum-tint);border-color:var(--plum);color:var(--plum)}
.feel-btn.on .fe{animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both}
.feel-btn:active{transform:scale(.97)}
.feel-note{font-family:var(--hand);font-size:1.32rem;line-height:1.3;color:var(--plum);margin-top:.75rem}
.feel.chosen{display:flex;align-items:flex-start;gap:.85rem;padding:.95rem 1.05rem}
.feel.chosen .fe-big{font-size:2.3rem;line-height:1;flex-shrink:0;margin-top:.1rem;animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both}
.feel.chosen b{display:block;font-size:1.08rem;line-height:1.25}
.feel.chosen .feel-note{margin-top:.15rem;font-size:1.22rem}
.feel-change{margin-top:.45rem;min-height:2.8rem;padding:.35rem 1rem;border-radius:999px;border:2px solid var(--line);
  font-weight:700;font-size:.9rem;color:var(--plum);background:var(--paper)}
.no-limit{display:block;font-size:.95rem;font-weight:700;color:var(--leaf);white-space:nowrap;margin-top:.3rem}
.cele-big{font-size:2.9rem}
.cele-actions{position:sticky;bottom:-1.25rem;margin:0 -1.2rem -1.25rem;padding:.7rem 1.2rem 1.25rem;background:var(--paper);
  border-radius:0 0 var(--r-lg) var(--r-lg);box-shadow:0 -10px 14px -12px rgba(0,0,0,.25)}
.gentle-chip{background:var(--leaf-tint);border-radius:var(--r-md);padding:.55rem .9rem;font-weight:700;font-size:.95rem;line-height:1.35;margin:0 0 .9rem}
.mini-note{background:var(--letter);color:var(--letter-ink);font-family:var(--hand);font-size:1.24rem;line-height:1.3;
  padding:.65rem .95rem .55rem;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.14);transform:rotate(-1deg);margin:.2rem .2rem 1rem;text-align:left;
  animation:letterIn .6s cubic-bezier(.2,.9,.3,1.1) .35s both}
.mini-note p{margin:0}
.mini-note .sig{text-align:right;margin-top:.15rem}

/* ---------- game shell ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;
  padding:calc(.7rem + env(safe-area-inset-top)) 0 .7rem;background:var(--bg)}
.home-btn{display:flex;align-items:center;gap:.3rem;min-height:3rem;padding:.35rem 1rem .35rem .75rem;border-radius:999px;
  background:var(--paper);border:2px solid var(--line);font-weight:700;color:var(--plum);flex-shrink:0}
.home-btn .chev{font-size:1.35rem;line-height:1;margin-top:-.1rem}
.tb-title{flex:1;font-size:1.02rem;line-height:1.15;min-width:0;text-align:center;overflow-wrap:anywhere}
.help-btn{width:3rem;height:3rem;border-radius:50%;background:var(--paper);border:2px solid var(--line);
  font-weight:700;font-size:1.15rem;color:var(--plum);flex-shrink:0;text-align:center}
.lede{color:var(--ink2);margin:.1rem 0 .9rem;font-size:1rem}
.status{background:var(--paper);border-radius:var(--r-md);padding:.7rem 1rem;font-weight:700;font-size:1.05rem;line-height:1.3;
  text-align:center;margin-bottom:.9rem;box-shadow:var(--shadow);min-height:3.2rem;display:flex;align-items:center;justify-content:center}
.pips{display:flex;justify-content:center;flex-wrap:wrap;gap:.45rem;margin:1rem 0}
.pips i{width:1.05rem;height:1.05rem;border-radius:50%;background:var(--paper2);border:2px solid var(--line);transition:all .3s}
.pips i.on{background:var(--leaf);border-color:var(--leaf);transform:scale(1.15)}
.progress{display:flex;gap:.35rem;margin-bottom:.85rem}
.progress i{flex:1;height:.5rem;border-radius:9px;background:var(--paper2)}
.progress i.done{background:var(--leaf)}
.progress i.now{background:var(--marigold)}
.tool-row{display:flex;gap:.6rem;margin-top:1rem}
.tool-row.stack{flex-direction:column}
.tool-row .btn{margin-top:0}

/* ---------- memory ---------- */
.peekbar{height:.45rem;border-radius:9px;background:var(--paper2);overflow:hidden;margin:-.35rem 0 .9rem}
.peekbar i{display:block;height:100%;background:var(--marigold);transform-origin:left;animation:shrink linear forwards}
.peekbar.gone{visibility:hidden}
.mem-grid{display:grid;gap:.6rem;margin:0 auto}
.mem-grid.c3{grid-template-columns:repeat(3,1fr);max-width:380px}
.mem-grid.c4{grid-template-columns:repeat(4,1fr);max-width:470px}
.card{position:relative;aspect-ratio:5/6;perspective:700px;border-radius:var(--r-sm)}
.card-in{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.up .card-in,.card.matched .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r-sm);display:grid;place-items:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:var(--plum);color:rgba(255,255,255,.4);font-size:1.6rem;box-shadow:0 4px 0 var(--plum-press);
  background-image:radial-gradient(rgba(255,255,255,.12) 1.5px,transparent 1.6px);background-size:12px 12px}
body.night .back{color:rgba(30,23,34,.45);background-image:radial-gradient(rgba(30,23,34,.15) 1.5px,transparent 1.6px)}
.front{background:var(--paper);border:2.5px solid var(--line);transform:rotateY(180deg);font-size:2.3rem;line-height:1}
.mem-grid.c4 .front{font-size:2rem}
.card.matched .front{background:var(--leaf-tint);border-color:var(--leaf)}
.card.matched .card-in{animation:matchPop .5s ease .1s}
.card.glow .back{box-shadow:0 0 0 4px var(--marigold),0 0 18px 4px var(--marigold)}

/* ---------- word jumble ---------- */
.clue{background:var(--paper);border-radius:var(--r-lg);padding:1rem 1.1rem;box-shadow:var(--shadow);margin-bottom:1.1rem}
.clue .cat{display:inline-block;color:var(--plum);background:var(--plum-tint);font-weight:700;font-size:.88rem;border-radius:999px;padding:.12rem .7rem}
.clue .q{font-size:1.28rem;font-weight:700;line-height:1.3;margin-top:.4rem}
.slots,.tiles{display:flex;justify-content:center;gap:8px}
.slots{margin-bottom:.4rem}
.slot{width:var(--cell,56px);height:calc(var(--cell,56px)*1.15);border-radius:var(--r-sm);background:var(--paper2);
  border:2.5px dashed var(--line);display:grid;place-items:center;font-size:calc(var(--cell,56px)*.5);font-weight:700;text-align:center}
.slot.filled{background:var(--paper);border:2.5px solid var(--plum)}
.slot.right{border-color:var(--leaf);background:var(--leaf-tint)}
.slot.locked{background:var(--marigold-tint);border:2.5px solid var(--marigold)}
.slot.win{background:var(--leaf);border-color:var(--leaf);color:var(--paper);animation:flipIn .45s ease}
.tiles{flex-wrap:wrap;margin-top:.5rem}
.tile{width:var(--cell,56px);height:var(--cell,56px);border-radius:var(--r-sm);background:var(--plum);color:var(--on-plum);
  font-size:calc(var(--cell,56px)*.5);font-weight:700;box-shadow:0 4px 0 var(--plum-press);text-align:center;transition:transform .1s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum-press)}
.tile.used{visibility:hidden}
.w-msg{text-align:center;color:var(--ink2);font-size:1rem;min-height:2.9rem;margin:.6rem 0 .3rem;line-height:1.35}
.w-msg.good{color:var(--leaf);font-weight:700;font-size:1.15rem}

/* ---------- quizzes ---------- */
.q-card{background:var(--paper);border-radius:var(--r-lg);padding:1.1rem;box-shadow:var(--shadow);margin-bottom:.95rem}
.q-tag{display:inline-block;font-weight:700;font-size:.88rem;color:var(--plum);background:var(--plum-tint);border-radius:999px;padding:.12rem .7rem;margin-bottom:.55rem}
.q-text{font-size:1.25rem;font-weight:700;line-height:1.35}
.q-sub{margin-top:.4rem;font-size:1.08rem;color:var(--ink2)}
.opts{display:grid;gap:.7rem}
.opt{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.7rem;padding:.7rem .9rem;border-radius:var(--r-md);
  background:var(--paper);border:2.5px solid var(--line);font-size:1.08rem;font-weight:700;line-height:1.3;text-align:left;transition:all .2s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .mark{width:2.1rem;height:2.1rem;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--paper2);font-size:.95rem;color:var(--ink2)}
.opt.right{background:var(--leaf-tint);border-color:var(--leaf)}
.opt.right .mark{background:var(--leaf);color:var(--paper);font-size:1.15rem}
.opt.picked{background:var(--marigold-tint);border-color:var(--marigold)}
.opt.faded{opacity:.5}
.opt.gone{opacity:.25}
.feedback{border-radius:var(--r-md);padding:.9rem 1rem;margin:1rem 0;font-size:1.03rem;line-height:1.45}
.feedback.good{background:var(--leaf-tint)}
.feedback.soft{background:var(--marigold-tint)}
.feedback b{display:block;font-size:1.12rem;margin-bottom:.2rem}
.q-hint{margin-top:1rem}

/* ---------- sequence ---------- */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;margin:0 auto .9rem;max-width:440px}
.pad{aspect-ratio:1/.86;border-radius:28px;display:grid;place-items:center;background:var(--c);
  box-shadow:0 6px 0 var(--d);transition:transform .12s,filter .12s,box-shadow .12s,opacity .2s}
.pad svg{width:40%;height:40%;pointer-events:none}
.pad:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.pad.lit{filter:brightness(1.3) saturate(1.1);transform:scale(1.05);
  box-shadow:0 0 0 5px var(--paper),0 0 0 10px var(--c),0 8px 34px var(--c)}
.watching .pad{cursor:default}
.watching .pad:not(.lit){opacity:.8}
.seq-info{display:flex;justify-content:space-between;gap:1rem;background:var(--paper);border-radius:var(--r-md);
  padding:.7rem 1rem;box-shadow:var(--shadow);margin-bottom:1rem}
.seq-info .lbl{display:block;font-size:.88rem;color:var(--ink2)}
.seq-info .dots{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.3rem}
.seq-info .dots i{width:.75rem;height:.75rem;border-radius:50%;background:var(--plum)}
.hearts{font-size:1.4rem;color:var(--rose);letter-spacing:.1rem;line-height:1.2}

/* ---------- spot the difference ---------- */
.spot-bar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.4rem}
.spot-bar .pips{margin:0;justify-content:flex-start}
.pic-label{font-weight:700;font-size:.95rem;color:var(--ink2);margin:.55rem 0 .3rem}
.pic{border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow);background:var(--paper);line-height:0}
.pic svg{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation}
.found-ring{fill:none;stroke:#2F9D5B;stroke-width:4;animation:ringIn .45s cubic-bezier(.2,.9,.3,1.4) both;transform-box:fill-box;transform-origin:center}
.hint-ring{fill:rgba(227,155,18,.16);stroke:#E39B12;stroke-width:3;stroke-dasharray:7 5;animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.miss{fill:rgba(92,79,99,.18);stroke:rgba(92,79,99,.6);stroke-width:2;animation:missFade .7s ease-out forwards;transform-box:fill-box;transform-origin:center}
.found-list{list-style:none;margin-top:.9rem;display:grid;gap:.35rem}
.found-list li{background:var(--leaf-tint);border-radius:var(--r-sm);padding:.45rem .8rem;font-weight:700;animation:rise .35s ease}

.shake{animation:shake .45s ease}
@keyframes ringIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.65}}
@keyframes missFade{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes bloom{0%{transform:translateY(10px) scale(.2);opacity:0}100%{transform:none;opacity:1}}
@keyframes letterIn{0%{transform:translateY(40px) rotate(4deg) scale(.9);opacity:0}100%{transform:rotate(-1.2deg);opacity:1}}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.07);box-shadow:0 0 0 4px var(--marigold)}}
@keyframes fall{to{transform:translate(var(--sway),112vh) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* Pick items she hasn't seen recently */
function pickFresh(game, pool, n, idOf, cap = 30) {
  const seen = new Set(S.seen[game] || []);
  const fresh = shuffle(pool.filter(x => !seen.has(idOf(x))));
  const rest = shuffle(pool.filter(x => seen.has(idOf(x))));
  const chosen = fresh.concat(rest).slice(0, n);
  S.seen[game] = (S.seen[game] || []).concat(chosen.map(idOf)).slice(-cap);
  save();
  return chosen;
}

const Sound = {
  ctx: null,
  ensure() {

    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  tone(freq, dur = .25, when = 0, vol = .07) {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
  },
  tap() { this.tone(660, .08, 0, .025); },
  good() { this.tone(784, .18, 0, .06); this.tone(1047, .3, .1, .06); },
  soft() { this.tone(392, .25, 0, .04); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .4, i * .12, .06)); },
